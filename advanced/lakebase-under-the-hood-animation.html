<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lakebase under the hood - animated data flows</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--navy:#1B3139;--lava:#FF3621;--blue:#2272B4;--yellow:#FFAB00;--green:#00A972;--cli:#C2185B;--oat:#F9F7F4;--gray:#C3CBD0;--ink:#1B3139;--muted:#5A6F77}
  html,body{margin:0;height:100%;background:#E9E7E2;font-family:"DM Sans",Inter,"Segoe UI",Helvetica,Arial,sans-serif;overflow:hidden}
  #stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center;background:var(--oat);box-shadow:0 10px 40px rgba(0,0,0,.18);border-radius:6px;overflow:hidden}
  svg{position:absolute;inset:0;width:1280px;height:720px}
  .title{font-size:30px;font-weight:700;fill:var(--ink)}
  .sub{font-size:17px;fill:var(--muted)}
  .tag{font-size:15px;font-weight:700;fill:#fff;text-anchor:middle}
  .band{fill:#fff;stroke:#DCE0E2;stroke-width:1.5}
  .band.s{fill:#F1F3F4}
  .bandlbl{font-size:12px;font-weight:700;letter-spacing:.14em;fill:var(--muted)}
  .tier{fill:#fff;stroke:#CBD3D7;stroke-width:1.5}
  .tierT{font-size:16px;font-weight:700;fill:var(--ink)}
  .tierD{font-size:11.5px;fill:var(--muted)}
  .chip{fill:#EEF1F3}
  .chipT{font-size:10.5px;font-weight:700;fill:var(--muted);letter-spacing:.06em}
  .node rect{transition:fill .25s,stroke .25s}
  .pg rect{fill:var(--navy)}
  .pg .nt{fill:#fff;font-size:20px;font-weight:700;text-anchor:middle}
  .pg .ns{fill:#B9C6CB;font-size:12.5px;text-anchor:middle}
  .sn rect{fill:#F7F8F9;stroke:#CBD3D7;stroke-width:1.2}
  .sn text{font-size:12px;fill:var(--ink);text-anchor:middle}
  .sn .small{font-size:10px;fill:var(--muted)}
  .seg rect{fill:#F7F8F9;stroke:#CBD3D7;stroke-dasharray:4 3}
  .seg text{font-size:12.5px;fill:var(--ink);text-anchor:middle;font-weight:600}
  .seg .small{font-size:10.5px;fill:var(--muted);font-weight:400}
  .flash.pg rect{fill:#2C4D59}
  .flash.sn rect{fill:#FFE9E5;stroke:var(--lava)}
  .flash.sn.blue rect{fill:#E3EEF8;stroke:var(--blue)}
  .flash.seg rect{fill:#FFF4DB;stroke:var(--yellow);stroke-dasharray:none}
  .flash.seg.green rect{fill:#DDF5EC;stroke:var(--green)}
  .flow{fill:none;stroke:var(--gray);stroke-width:2;marker-end:url(#ah-gray);transition:stroke .3s,stroke-width .3s,opacity .3s;opacity:.75}
  .flow.ack{stroke-dasharray:5 4}
  .flow.on{opacity:1;stroke-width:3}
  .flow.on.wal{stroke:var(--lava);marker-end:url(#ah-wal)}
  .flow.on.page{stroke:var(--blue);marker-end:url(#ah-page)}
  .flow.on.layer{stroke:var(--yellow);marker-end:url(#ah-layer)}
  .flow.on.pq,.flow.on.ack{stroke:var(--green);marker-end:url(#ah-pq)}
  .flow.on.cli{stroke:var(--cli);marker-end:url(#ah-cli)}
  /* clients & drivers chips */
  .node.cli rect{fill:#fff;stroke:#CBD3D7;stroke-width:1.2}
  .node.cli text{font-size:11px;font-weight:700;fill:var(--ink);text-anchor:middle}
  .flash.cli rect{fill:#FCE4EE;stroke:var(--cli)}
  .badge.cli rect{fill:var(--cli)}
  .bus{stroke:#C3CBD0;stroke-width:1.5;fill:none}
  .lbl{font-size:12.5px;font-weight:700;fill:var(--muted);paint-order:stroke;stroke:#F1F3F4;stroke-width:5px;stroke-linejoin:round}
  .lbl.w{stroke:#fff}
  .badge{opacity:0;transition:opacity .3s}
  .badge.show{opacity:1}
  .badge rect{fill:var(--navy)}
  .badge.lava rect{fill:var(--lava)}
  .badge.green rect{fill:var(--green)}
  .badge.blue rect{fill:var(--blue)}
  .badge.yellow rect{fill:#E89A00}
  .badge text{fill:#fff;font-size:12px;font-weight:700;text-anchor:middle}
  #callout-line{stroke:var(--green);stroke-width:1.5;stroke-dasharray:3 4;fill:none;opacity:.35;transition:opacity .3s}
  #callout-line.on{opacity:1}
  .foot{font-size:11px;fill:#8A9AA0}
  /* HTML overlays */
  #panel{position:absolute;left:1010px;top:110px;width:240px;height:540px;background:#fff;border:1.5px solid #DCE0E2;border-radius:14px;padding:16px 16px 12px;box-sizing:border-box;color:var(--ink)}
  #panel .k{font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--lava)}
  #panel h3{margin:6px 0 8px;font-size:18px;line-height:1.2}
  #panel p{margin:0 0 12px;font-size:13px;line-height:1.45;color:#3C5560;min-height:112px}
  #steps{list-style:none;margin:0;padding:0;border-top:1px solid #EEF1F3;padding-top:8px}
  #steps li{font-size:12.5px;padding:4px 6px;border-radius:6px;cursor:pointer;color:var(--muted);display:flex;gap:8px}
  #steps li b{color:var(--gray);width:16px}
  #steps li.cur{background:#FFF0ED;color:var(--ink);font-weight:700}
  #steps li.cur b{color:var(--lava)}
  #callout{position:absolute;left:1010px;top:500px;width:240px;height:150px;background:#fff;border:1.5px solid #DCE0E2;border-left:5px solid var(--green);border-radius:12px;padding:12px 14px;box-sizing:border-box;transition:box-shadow .3s,border-color .3s}
  #callout.on{box-shadow:0 0 0 4px rgba(0,169,114,.18);border-color:var(--green)}
  #callout .h{font-weight:700;font-size:14px;color:var(--ink);margin-bottom:6px}
  #callout .t{font-size:12.5px;line-height:1.45;color:#3C5560}
  #callout .p{margin-top:8px;font-size:12px;font-weight:700;color:var(--green)}
  #controls{position:absolute;left:40px;top:676px;display:flex;gap:8px;align-items:center}
  #controls button,#controls select{font:600 12.5px "DM Sans",Inter,Arial,sans-serif;border:1.5px solid #CBD3D7;background:#fff;color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
  #controls button:hover{border-color:var(--navy)}
  #controls #play{background:var(--navy);color:#fff;border-color:var(--navy);min-width:84px}
  #legend{display:flex;gap:14px;margin-left:16px;font-size:12px;color:var(--muted)}
  #legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px;background:var(--c)}
  #bar{position:absolute;left:0;top:0;height:4px;background:var(--lava);width:0}
  /* compute topology selector */
  .rep{transition:opacity .5s}
  #stage.single .rep{opacity:0;pointer-events:none}
  #mode{position:absolute;right:30px;top:40px;display:flex;border:1.5px solid #CBD3D7;border-radius:9px;overflow:hidden;background:#fff}
  #mode button{font:600 12.5px "DM Sans",Inter,Arial,sans-serif;border:0;background:#fff;color:var(--ink);padding:7px 14px;cursor:pointer}
  #mode button+button{border-left:1.5px solid #CBD3D7}
  #mode button.sel{background:var(--navy);color:#fff}
  /* vertical autoscaling: load meter + CU gauge, box resizes about its centre */
  .asg{opacity:0;transition:opacity .5s}
  #stage.autoscale .asg{opacity:1}
  .gbg{fill:#EEF1F3;stroke:#CBD3D7}
  .glbl{font-size:10px;fill:var(--muted);text-anchor:middle;font-weight:700}
  .gval{font-size:15px;font-weight:700;fill:var(--ink)}
  .gval.sm{font-size:13px}
  .gsub{font-size:10px;fill:var(--muted)}
  #pg1,#pg2{transform-box:fill-box;transform-origin:center}
  .pg.suspended{opacity:.55}
  .pg.suspended rect{fill:#8FA0A7}
</style>
</head>
<body>

<div id="bar"></div>

    <path d="M13.7194 6.60746L7.25506 10.338L0.332928 6.35214L0 6.53654L0 9.43016L7.25506 13.6004L13.7194 9.88406V11.416L7.25506 15.1465L0.332928 11.1607L0 11.3451L0 11.8415L7.25506 16.0117L14.4962 11.8415V8.94789L14.1633 8.76349L7.25506 12.7351L0.776832 9.01881L0.776832 7.4869L7.25506 11.2032L14.4962 7.033V4.18193L14.1356 3.96917L7.25506 7.92661L1.10976 4.40888L7.25506 0.876967L12.3045 3.78477L12.7484 3.52945V3.17484L7.25506 0.0117187L0 4.18193L0 4.63583L7.25506 8.80605L13.7194 5.07555V6.60746Z" fill="#FF3621"/>
  </g>
  <text x="100" y="46" class="title">Lakebase under the hood</text>
  <text x="100" y="70" class="sub">Stateless Postgres on shared, multi-tenant storage</text>

  <text x="100" y="94" class="bandlbl">CLIENTS</text>
  <g id="cl-1" class="node cli"><rect x="184" y="80" width="44" height="19" rx="9.5"/><text x="206" y="93.5">psql</text></g>
  <g id="cl-2" class="node cli"><rect x="236" y="80" width="64" height="19" rx="9.5"/><text x="268" y="93.5">psycopg</text></g>

  <g id="pg1" class="node pg"><rect x="120" y="148" width="300" height="98" rx="12"/><text x="270" y="193" class="nt">PostgreSQL</text><text x="270" y="217" class="ns">Stateless micro-VM · primary (R/W)</text></g>

  <rect x="878" y="382" width="60" height="20" rx="5" class="chip"/><text x="908" y="396" class="chipT" text-anchor="middle">NVMe SSD</text>

  <g id="sk2" class="node sn"><rect x="699" y="436" width="112" height="54" rx="9"/><text x="755" y="459">safekeeper-2</text><text x="755" y="475" class="small">AZ-b</text></g>

  <!-- Object storage -->

  <text x="108" y="566" class="tierT">Object storage</text>
  <text x="236" y="566" class="tierD">Durable, zone-redundant · S3 (AWS) · Blob (Azure) · GCS (GCP)</text>

<div id="panel">
  <div class="k" id="stepk">STEP 1 OF 6</div>
  <h3 id="steph"></h3>
  <p id="stepp"></p>

<script>
(function(){
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const layer = $('packets');

  // ---------- fit to window ----------
  function fit(){ const s = Math.min(innerWidth/1300, innerHeight/740); $('stage').style.transform = `translate(-50%,-50%) scale(${s})`; }
  addEventListener('resize', fit); fit();

  // ---------- simulation clock (pausable) ----------
  let simT = 0, last = performance.now(), playing = true, speed = 1, auto = true;
  let timers = [], packets = [], stageIdx = 0, stageStart = 0, stageDur = 1;
  let stageTick = null;                  // optional per-frame hook for the current stage (autoscaling)
  let mode = 'single';                   // 'single' = 1 compute node (default), 'ha' = primary + 1 read replica
  const isHA = () => mode === 'ha';
  const after = (ms, fn) => timers.push({at: simT + ms, fn});
  const every = (ms, total, fn) => { for (let t = 0; t < total; t += ms) after(t, fn); };
  const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2;

  const COLORS = {wal:'#FF3621', page:'#2272B4', layer:'#FFAB00', pq:'#00A972', ack:'#00A972', req:'#2272B4', cli:'#C2185B'};
  function makeShape(kind){
    const g = document.createElementNS(NS, 'g');
    const c = COLORS[kind];
    if (kind === 'wal' || kind === 'ack') {
      const e = document.createElementNS(NS, 'circle');
      e.setAttribute('r', kind === 'ack' ? 6 : 7); e.setAttribute('fill', c);
      e.setAttribute('stroke', '#fff'); e.setAttribute('stroke-width', 2); g.appendChild(e);
    } else if (kind === 'req') {
      const e = document.createElementNS(NS, 'circle');
      e.setAttribute('r', 6); e.setAttribute('fill', '#fff'); e.setAttribute('stroke', c); e.setAttribute('stroke-width', 2.5); g.appendChild(e);
    } else if (kind === 'pq') {
      for (let i = 0; i < 3; i++) { const r = document.createElementNS(NS, 'rect');
        r.setAttribute('x', -8 + i*5.5); r.setAttribute('y', -8); r.setAttribute('width', 4.5); r.setAttribute('height', 16); r.setAttribute('rx', 1);
        r.setAttribute('fill', c); g.appendChild(r); }
    } else {
      const r = document.createElementNS(NS, 'rect');
      r.setAttribute('x', -9); r.setAttribute('y', -7); r.setAttribute('width', 18); r.setAttribute('height', 14); r.setAttribute('rx', 2.5);
      r.setAttribute('fill', c); r.setAttribute('stroke', '#fff'); r.setAttribute('stroke-width', 1.5); g.appendChild(r);
    }
    return g;
  }
  function send(pathId, kind, dur, opts = {}){
    const path = $(pathId); const el = makeShape(kind); layer.appendChild(el);
    const p = {path, el, len: path.getTotalLength(), start: simT, dur, rev: !!opts.reverse, onArrive: opts.onArrive};
    place(p, 0); packets.push(p);
  }
  function place(p, t){ const L = p.len * (p.rev ? 1 - ease(t) : ease(t)); const pt = p.path.getPointAtLength(L); p.el.setAttribute('transform', `translate(${pt.x},${pt.y})`); }

  function flash(id, ms = 500){ const n = $(id); n.classList.add('flash'); after(ms, () => n.classList.remove('flash')); }
  function badge(id, text, cls = '', ms = 0){ const b = $(id); b.querySelector('text').textContent = text; b.setAttribute('class', 'badge show ' + cls); if (ms) after(ms, () => b.classList.remove('show')); }

  function tick(dt){
    timers.sort((a, b) => a.at - b.at);
    while (timers.length && timers[0].at <= simT) timers.shift().fn();
    if (stageTick) stageTick(dt);
    for (const p of packets) {
      const t = (simT - p.start) / p.dur;
      if (t >= 1) { p.el.remove(); p.done = true; if (p.onArrive) p.onArrive(); continue; }
      place(p, t);
    }
    packets = packets.filter(p => !p.done);
    $('bar').style.width = Math.min(100, (simT - stageStart) / stageDur * 100) + '%';
  }
  function frame(now){ const dt = Math.min(now - last, 50); last = now; if (playing) { simT += dt * speed; tick(dt * speed); } requestAnimationFrame(frame); }

  // ---------- flow helpers ----------
  function commit(withAck = true){
    badge('b-pg1', 'INSERT … ; COMMIT', '', 1600);
    let acks = 0;
    [1100, 1350, 2100].forEach((d, i) => after(i * 60, () => send('p-wal-' + (i + 1), 'wal', d, {onArrive: () => {
      flash('sk' + (i + 1)); acks++;
      if (acks === 2 && withAck) {
        badge('b-sk', 'Quorum 2 of 3 ✓', 'green', 1400);
        send('p-ack', 'ack', 950, {onArrive: () => { flash('pg1'); badge('b-pg1', 'COMMIT acknowledged ✓', 'green', 1200); }});
      }
    }})));
  }
  const streamWal = () => send('p-sk-ps', 'wal', 700, {onArrive: () => flash(Math.random() < .5 ? 'ps1' : 'ps2')});
  const flushLayer = () => send('p-layers', 'layer', 800, {onArrive: () => flash('os-layers')});
  const flushParquet = () => send('p-parquet', 'pq', 1000, {onArrive: () => flash('os-parquet')});
  const archive = () => send('p-archive', 'wal', 800, {onArrive: () => flash('os-wal')});
  // Clients & drivers: a request from one client travels to the primary
  const CLIENTS = ['psql', 'psycopg', 'JDBC', 'DBeaver', 'Data API (PostgREST)', 'pg_graphql', 'Spark streaming source'];
  function clientReq(k, quiet = false){
    flash('cl-' + k, 800);
    send('p-cli', 'cli', 700, {onArrive: () => { flash('pg1'); if (!quiet) badge('b-pg1', CLIENTS[k - 1], 'cli', 1000); }});
  }
  const randomClient = () => clientReq(1 + Math.floor(Math.random() * 7), true);
  function pageRead(which){
    if (which === 2 && !isHA()) which = 1;   // single primary: every read is served by the primary
    const pg = which === 1 ? 'pg1' : 'pg2', path = which === 1 ? 'p-pr-1' : 'p-pr-2', ps = which === 1 ? 'ps1' : 'ps2', b = which === 1 ? 'b-pg1' : 'b-pg2';
    // No packet travels against the arrow: show the miss, the pageserver rebuilding the page, then the page flowing up
    badge(b, 'SELECT … buffer-cache miss', 'blue', 1300);
    after(700, () => {
      $(ps).classList.add('blue'); flash(ps, 900); after(900, () => $(ps).classList.remove('blue'));
      badge('b-ps', 'GetPage@LSN → image + WAL deltas', 'blue', 1300);
      after(650, () => send(path, 'page', 950, {onArrive: () => { flash(pg); badge(b, 'Page returned → rows sent', 'blue', 1200); }}));
    });
  }

  // ---------- vertical autoscaling ----------
  // CU sizes and the 0.5-8 CU range are illustrative; the idle timeout is shortened for the animation.
  const CU_SIZES = [0.5, 1, 2, 4, 8], CU_MAX = 8, IDLE_TO_ZERO = 1500;
  const kf = (frames, ms) => { for (let i = 0; i < frames.length - 1; i++) { const [t0, v0] = frames[i], [t1, v1] = frames[i + 1];
    if (ms <= t1) return v0 + (v1 - v0) * Math.max(0, Math.min(1, (ms - t0) / (t1 - t0))); } return frames[frames.length - 1][1]; };
  // primary: ramp up, peak, ramp down, idle -> scale to zero, then a query wakes it
  const LOAD1 = [[0,.1],[1500,.1],[5500,1],[8000,1],[10500,.15],[11000,0],[13500,0],[13520,.08],[15500,.08],[15600,0],[16500,0]];
  // replica (HA mode): its own, smaller peak; it goes idle and scales to zero on its own
  const LOAD2 = [[0,.05],[2500,.45],[6000,.45],[8000,0],[16500,0]];   // peaks at 4 CU
  const mkScaler = n => ({n, cu: .5, target: .5, idle: 0});
  function scaleTo(sc, load, dt){
    sc.idle = load < .02 ? sc.idle + dt : 0;
    let tgt = CU_SIZES.find(s => s / CU_MAX >= load * .85) ?? CU_MAX;
    if (sc.idle > IDLE_TO_ZERO) tgt = 0;
    if (tgt !== sc.target) {
      const b = sc.n === 1 ? 'b-pg1' : 'b-pg2';
      if (tgt === 0) badge(b, 'Idle \u2192 scale to zero', '', 1800);
      else if (sc.target === 0) badge(b, 'Query arrives \u2192 wake to ' + tgt + ' CU', 'blue', 1400);
      else badge(b, (tgt > sc.target ? 'Scale up \u2192 ' : 'Scale down \u2192 ') + tgt + ' CU', tgt > sc.target ? 'green' : '', 1200);
      sc.target = tgt;
    }
    sc.cu += (sc.target - sc.cu) * Math.min(1, dt / 150);   // settles in roughly 500 ms
    if (Math.abs(sc.target - sc.cu) < .01) sc.cu = sc.target;
    renderScaler(sc, load);
  }
  function renderScaler(sc, load){
    const n = sc.n, lh = 92 * load, ch = 92 * Math.sqrt(sc.cu / CU_MAX);
    $('load' + n).setAttribute('y', 242 - lh); $('load' + n).setAttribute('height', lh);
    $('cu' + n).setAttribute('y', 242 - ch); $('cu' + n).setAttribute('height', ch);
    $('cu' + n + '-t').textContent = (sc.cu < .05 ? '0' : sc.cu < 1 ? sc.cu.toFixed(1) : String(Math.round(sc.cu))) + ' CU';
    const pg = $('pg' + n);
    pg.style.transform = `scale(${(.92 + .12 * Math.sqrt(sc.cu / CU_MAX)).toFixed(3)})`;
    pg.classList.toggle('suspended', sc.target === 0 && sc.cu < .05);
  }
  function resetScalers(){ [1, 2].forEach(n => { $('pg' + n).style.transform = ''; $('pg' + n).classList.remove('suspended'); }); }

  // ---------- stages ----------
  const STAGES = [
    { t: 'Clients and drivers', on: ['p-cli'], dur: 9000,
      d: 'Apps and tools connect to the primary Postgres compute: psql, psycopg (Python), JDBC (Java) and GUI tools such as DBeaver over the Postgres protocol; HTTP clients through the Data API (PostgREST) or pg_graphql; and Spark through a streaming data source.',
      run(){ for (let k = 1; k <= 7; k++) after(400 + (k - 1) * 1100, () => clientReq(k)); } },
    { t: 'Write path: commit', on: ['p-wal-1','p-wal-2','p-wal-3','p-ack'], dur: 5200,
      d: 'The primary streams WAL records to three safekeepers, one per availability zone. A transaction commits as soon as 2 of 3 have durably persisted it.',
      run(){ commit(); after(2700, () => commit()); } },
    { t: 'WAL to pageservers', on: ['p-sk-ps'], dur: 5000,
      d: 'Safekeepers stream WAL to the pageservers, which apply it asynchronously, off the commit path. Pageservers act as a write-through cache above object storage.',
      run(){ badge('b-ps', 'Ingest WAL → in-memory layer', 'lava'); every(380, 4200, streamWal); } },
    { t: 'Flush to object storage', on: ['p-layers','p-parquet'], co: true, dur: 5600,
      d: 'Pageservers flush layer files (page images plus WAL deltas) to object storage. The same flush also writes a columnar copy: rows transcoded to Parquet.',
      run(){ badge('b-ps', 'Flush layers', 'yellow'); every(650, 4800, flushLayer); after(250, () => every(650, 4600, flushParquet));
             after(900, () => badge('b-os', 'Parquet copy: row versions preserved', 'green')); } },
    { t: 'WAL archive', on: ['p-archive'], dur: 4000,
      d: 'Safekeepers archive WAL segments to durable, zone-redundant object storage. This history backs point-in-time restore and copy-on-write branches.',
      run(){ badge('b-sk', 'Archive WAL segments', 'lava'); every(420, 3400, archive); } },
    { t: 'Read path: page fetch', on: ['p-pr-1','p-pr-2'], dur: 6200,
      d: () => isHA()
        ? 'Primary and read replica both read pages from the same pageservers, so a replica duplicates no data. On a cache miss, Postgres requests a page at an LSN; the pageserver rebuilds and returns it.'
        : 'The single primary serves all reads. On a cache miss, Postgres requests a page at an LSN; the pageserver rebuilds it from the latest image plus WAL deltas and returns it.',
      run(){ pageRead(2); after(3000, () => pageRead(1)); } },
    { t: 'Vertical autoscaling', on: ['p-wal-1','p-wal-2','p-wal-3','p-pr-1','p-pr-2'], dur: 16500, as: true,
      d: () => 'Compute resizes with load: the CU gauge follows demand within a min/max range, in about 500 ms. Storage does not change. When idle, the compute scales to zero; the next query wakes it.'
        + (isHA() ? ' The replica scales on its own and can reach zero independently.' : '') + ' Source: deck slide 11 (autoscaling in ~500 ms, scale to zero). CU range illustrative; idle timeout shortened.',
      run(){
        const sc1 = mkScaler(1), sc2 = mkScaler(2); let gen = 0;
        renderScaler(sc1, 0); renderScaler(sc2, 0);
        stageTick = dt => {
          const ms = simT - stageStart, l1 = kf(LOAD1, ms), l2 = isHA() ? kf(LOAD2, ms) : 0;
          scaleTo(sc1, l1, dt); if (isHA()) scaleTo(sc2, l2, dt);
          // request traffic follows the load; packets only move in arrow direction
          for (gen += dt; gen >= 120; gen -= 120) {
            if (Math.random() < l1 * .45) { const k = 1 + Math.floor(Math.random() * 3); send('p-wal-' + k, 'wal', 1100, {onArrive: () => flash('sk' + k)}); }
            if (Math.random() < l1 * .55) send('p-pr-1', 'page', 900, {onArrive: () => flash('pg1')});
            if (isHA() && Math.random() < l2 * .6) send('p-pr-2', 'page', 950, {onArrive: () => flash('pg2')});
          }
        };
        after(14100, () => pageRead(1));   // the waking query completes
      } },
    { t: 'Steady state', on: ['p-wal-1','p-wal-2','p-wal-3','p-ack','p-sk-ps','p-layers','p-parquet','p-archive','p-pr-1','p-pr-2','p-cli'], co: true, dur: 9000,
      d: 'All flows at once: stateless compute on top of durable, shared, multi-tenant storage. Compute and storage scale and recover independently.',
      run(){ every(1800, 8000, () => commit()); every(450, 8600, streamWal);
             every(1100, 8600, flushLayer); after(400, () => every(1100, 8200, flushParquet)); every(900, 8600, archive);
             after(1200, () => pageRead(2)); after(4600, () => pageRead(1)); after(6800, () => pageRead(2));
             every(1500, 8600, randomClient); } }
  ];

  const list = $('steps');
  STAGES.forEach((s, i) => { const li = document.createElement('li'); li.innerHTML = `<b>${i + 1}</b><span>${s.t}</span>`; li.onclick = () => go(i); list.appendChild(li); });

  function go(i){
    stageIdx = (i + STAGES.length) % STAGES.length; const s = STAGES[stageIdx];
    timers = []; packets.forEach(p => p.el.remove()); packets = [];
    stageTick = null; resetScalers(); $('stage').classList.toggle('autoscale', !!s.as);
    document.querySelectorAll('.flash').forEach(n => n.classList.remove('flash'));
    document.querySelectorAll('.node.sn').forEach(n => n.classList.remove('blue'));
    document.querySelectorAll('.badge').forEach(b => b.classList.remove('show'));
    document.querySelectorAll('.flow').forEach(p => p.classList.toggle('on', s.on.includes(p.id)));
    $('stepk').textContent = `STEP ${stageIdx + 1} OF ${STAGES.length}`; $('steph').textContent = s.t; $('stepp').textContent = typeof s.d === 'function' ? s.d() : s.d;
    [...list.children].forEach((li, k) => li.classList.toggle('cur', k === stageIdx));
    stageStart = simT; stageDur = s.dur; s.run();
    after(s.dur, () => { if (auto) go(stageIdx + 1); else timers = []; });
  }

  // ---------- controls ----------
  const setPlay = v => { playing = v; $('play').textContent = v ? '❚❚ Pause' : '▶ Play'; };
  $('play').onclick = () => setPlay(!playing);
  $('next').onclick = () => go(stageIdx + 1);
  $('prev').onclick = () => go(stageIdx - 1);
  $('speed').onchange = e => speed = parseFloat(e.target.value);
  function setMode(m){
    mode = m;
    $('stage').classList.toggle('single', m === 'single');
    $('mode-single').classList.toggle('sel', m === 'single'); $('mode-ha').classList.toggle('sel', m === 'ha');
    go(stageIdx);   // restart the current step with the new number of compute nodes
  }
  $('mode-single').onclick = () => setMode('single');
  $('mode-ha').onclick = () => setMode('ha');
  $('auto').onclick = () => { auto = !auto; $('auto').textContent = 'Auto: ' + (auto ? 'on' : 'off'); if (auto && !timers.length) go(stageIdx + 1); };
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); setPlay(!playing); }
    else if (e.key === 'ArrowRight') go(stageIdx + 1);
    else if (e.key === 'ArrowLeft') go(stageIdx - 1);
  });

  go(0); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
