<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lakebase data flows - from clients and one compute to synced tables, CDF and managed DR</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  // resolve theme before first paint: saved choice, else OS preference
  (function(){ let t; try { t = localStorage.getItem('lb-theme'); } catch (e) {}
    document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); })();
</script>
<style>
  :root{
    /* brand */
    --lava:#FF3621;--navy:#0B2026;
    --font:"DM Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
    --font-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    /* motion tokens (brand-tokens.css) */
    --dur-instant:100ms;--dur-state:250ms;--dur-layout:400ms;--dur-entrance:600ms;
    --ease-quart:cubic-bezier(.25,1,.5,1);--ease-quint:cubic-bezier(.22,1,.36,1);
    /* flow categories (legend-coded) */
    --blue:#2272B4;--yellow:#FFAB00;--green:#00A972;--purple:#7A4FD6;--teal:#0B8F8F;--indigo:#4F5FD8;--rt:#D9480F;
    /* light theme surfaces */
    --page:#EEEDE9;--stage:#F9F7F4;--surface:#FFFFFF;--surface-2:#EEEDE9;--node:#F9F7F4;--chip:#EEEDE9;
    --ink:#0B2026;--muted:#4A5568;--faint:#6B7280;--line:#C4CCD6;--line-soft:#DDE1E6;
    --flow-idle:#C4CCD6;--q:#0B2026;--badge:#0B2026;
    --pg:#0B2026;--pg-flash:#1B5162;--pg-idle:#A0AEC0;--pg-sub:#CBD5E0;
    /* control plane */
    --cp-bg:#0B2026;--cp-line:#1B5162;--cp-chip:#143D4A;--cp-chip-line:#618794;
    --cp-text:#F9F7F4;--cp-muted:#A0AEC0;--cp-rw:#00A972;--cp-ro:#A0C4D9;--cp-api:#FF9482;
    --stage-shadow:0 10px 40px rgba(11,32,38,.18);
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --page:#071A1F;--stage:#0B2026;--surface:#143D4A;--surface-2:#10313B;--node:#0B2026;--chip:#0B2026;
    --ink:#FFFFFF;--muted:#CBD5E0;--faint:#A0AEC0;--line:#4A5568;--line-soft:#1B5162;
    --flow-idle:#4A5568;--q:#F9F7F4;--badge:#1B5162;
    --pg:#003159;--pg-flash:#1B5162;--pg-idle:#4A5568;--pg-sub:#A0C4D9;
    --cp-bg:#143D4A;--cp-line:#1B5162;--cp-chip:#0B2026;--cp-chip-line:#4A5568;
    --stage-shadow:0 0 0 1px #1B5162;
    color-scheme:dark;
  }
  html,body{margin:0;height:100%;background:var(--page);font-family:var(--font);overflow:hidden}
  #stage{position:absolute;left:50%;top:50%;width:1280px;height:880px;transform-origin:center center;background:var(--stage);box-shadow:var(--stage-shadow);border-radius:6px;overflow:hidden}
  svg{position:absolute;inset:0;width:1280px;height:880px}
  svg text{font-family:var(--font)}
  .title{font-size:30px;font-weight:700;fill:var(--ink)}
  .sub{font-size:17px;fill:var(--muted)}
  .band{fill:var(--surface);stroke:var(--line-soft);stroke-width:1.5}
  .band.s{fill:var(--surface-2)}
  .bandlbl{font-size:12px;font-weight:700;letter-spacing:.14em;fill:var(--muted)}
  .tier{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
  .tierT{font-size:16px;font-weight:700;fill:var(--ink)}
  .tierD{font-size:11.5px;fill:var(--muted)}
  .chip{fill:var(--chip)}
  .chipT{font-size:10.5px;font-weight:700;fill:var(--muted);letter-spacing:.06em}
  .node rect{transition:fill var(--dur-state) var(--ease-quart),stroke var(--dur-state) var(--ease-quart)}
  .pg rect{fill:var(--pg)}
  .pg .nt{fill:#fff;font-size:20px;font-weight:700;text-anchor:middle}
  .pg .ns{fill:var(--pg-sub);font-size:12.5px;text-anchor:middle}
  .pg.idle rect{fill:var(--pg-idle)}
  .pg.idle.active rect{fill:var(--pg)}
  .flash.pg rect{fill:var(--pg-flash)}
  /* storage / lakehouse nodes: --fc is the flash color for the node */
  .sn{--fc:var(--lava)} .sn.blue{--fc:var(--blue)} .sn.purple{--fc:var(--purple)} .sn.teal{--fc:var(--teal)} .sn.rt{--fc:var(--rt)}
  .sn rect{fill:var(--node);stroke:var(--line);stroke-width:1.2}
  .sn text{font-size:12px;fill:var(--ink);text-anchor:middle}
  .sn .bt{font-size:13px;font-weight:700}
  .sn .small{font-size:10px;fill:var(--muted)}
  .flash.sn rect{fill:color-mix(in srgb,var(--fc) 16%,var(--node));stroke:var(--fc)}
  .seg{--fc:var(--yellow)} .seg.green{--fc:var(--green)} .seg.indigo{--fc:var(--indigo)}
  .seg rect{fill:var(--node);stroke:var(--line);stroke-dasharray:4 3}
  .seg text{font-size:12.5px;fill:var(--ink);text-anchor:middle;font-weight:500}
  .seg .small{font-size:10.5px;fill:var(--muted);font-weight:400}
  .flash.seg rect{fill:color-mix(in srgb,var(--fc) 16%,var(--node));stroke:var(--fc);stroke-dasharray:none}
  .flow{fill:none;stroke:var(--flow-idle);stroke-width:2;marker-end:url(#ah-gray);opacity:.75;transition:stroke var(--dur-state) var(--ease-quart),stroke-width var(--dur-state) var(--ease-quart),opacity var(--dur-state) var(--ease-quart)}
  .flow.ack{stroke-dasharray:5 4}
  .flow.on{opacity:1;stroke-width:3}
  .flow.on.wal{stroke:var(--lava);marker-end:url(#ah-wal)}
  .flow.on.page{stroke:var(--blue);marker-end:url(#ah-page)}
  .flow.on.layer{stroke:var(--yellow);marker-end:url(#ah-layer)}
  .flow.on.pq,.flow.on.ack{stroke:var(--green);marker-end:url(#ah-pq)}
  .flow.on.sync{stroke:var(--purple);marker-end:url(#ah-sync)}
  .flow.on.cdf{stroke:var(--teal);marker-end:url(#ah-cdf)}
  .flow.on.dr{stroke:var(--indigo);marker-end:url(#ah-dr)}
  .flow.on.rt{stroke:var(--rt);marker-end:url(#ah-rt)}
  .flow.on.q{stroke:var(--q);marker-end:url(#ah-q)}
  .m-idle{fill:var(--flow-idle)} .m-q{fill:var(--q)}
  .foot{font-size:11px;fill:var(--faint)}
  /* control plane (always navy) */
  .topbox{fill:var(--cp-bg);stroke:var(--cp-line);stroke-width:1.2}
  .toplabel{font-size:12px;font-weight:700;letter-spacing:.14em;fill:var(--cp-muted)}
  .tophead{font-size:17px;font-weight:700;fill:var(--cp-text);text-anchor:middle}
  .topsub{font-size:14px;font-weight:500;fill:var(--cp-ro)}
  .clientChip{--fc:var(--lava)} .clientChip.green{--fc:var(--cp-rw)} .clientChip.api{--fc:var(--cp-api)}
  .clientChip rect{fill:var(--cp-chip);stroke:var(--cp-chip-line);stroke-width:1.2}
  .clientChip text{font-size:10.8px;fill:var(--cp-text);text-anchor:middle;font-weight:700;letter-spacing:.02em}
  .clientChip.green rect,.clientChip.api rect{stroke:var(--fc)}
  .clientChip.green text,.clientChip.api text{fill:var(--fc)}
  .flash.clientChip rect{fill:color-mix(in srgb,var(--fc) 28%,var(--cp-chip));stroke:var(--fc)}
  .domain,.epText{font-family:var(--font-mono)}
  .domain{font-size:11.8px;fill:var(--cp-muted);text-anchor:middle}
  .epHead{font-size:11px;font-weight:700;letter-spacing:.03em}
  .epHead.rw{fill:var(--cp-rw)}
  .epHead.ro{fill:var(--cp-ro)}
  .epHead.mid{fill:var(--cp-muted);text-anchor:middle}
  .epText{font-size:10.2px;fill:var(--cp-text)}
  .epText.sm{font-size:8.9px}
  .epText.api{fill:var(--cp-api)}
  .epMid{font-size:11px;font-weight:700;fill:var(--cp-text);text-anchor:middle}
  .epMid.small{font-size:10px;font-weight:500;fill:var(--cp-muted)}
  .epMid.api{fill:var(--cp-api)}
  .epMid.halo{paint-order:stroke;stroke:var(--cp-bg);stroke-width:4px;stroke-linejoin:round}
  #bouncer .poolTag{fill:var(--cp-chip);stroke:var(--cp-chip-line);stroke-width:1;transition:fill var(--dur-state) var(--ease-quart),stroke var(--dur-state) var(--ease-quart)}
  #bouncer.flash .poolTag{fill:color-mix(in srgb,var(--lava) 28%,var(--cp-chip));stroke:var(--lava);stroke-width:1.4}
  #ro-ep .robg{fill:transparent;stroke:transparent;transition:fill var(--dur-state) var(--ease-quart),stroke var(--dur-state) var(--ease-quart)}
  #ro-ep.flash .robg{fill:color-mix(in srgb,var(--cp-ro) 18%,var(--cp-bg));stroke:var(--cp-ro);stroke-width:1.2}
  /* flow labels get a halo matching what they sit on */
  .lbl{font-size:12.5px;font-weight:700;fill:var(--muted);paint-order:stroke;stroke:var(--surface-2);stroke-width:5px;stroke-linejoin:round}
  .lbl.w{stroke:var(--surface)}
  .lbl.o{stroke:var(--stage)}
  /* badges: rise in on enter, exit ~75% of enter duration */
  .badge{opacity:0;transform:translateY(4px);transition:opacity 190ms var(--ease-quart),transform 190ms var(--ease-quart)}
  .badge.show{opacity:1;transform:none;transition-duration:var(--dur-state)}
  .badge rect{fill:var(--badge)}
  .badge.lava rect{fill:var(--lava)}
  .badge.green rect{fill:var(--green)}
  .badge.blue rect{fill:var(--blue)}
  .badge.yellow rect{fill:#E89A00}
  .badge.purple rect{fill:var(--purple)}
  .badge.teal rect{fill:var(--teal)}
  .badge.indigo rect{fill:var(--indigo)}
  .badge.rt rect{fill:var(--rt)}
  .badge text{fill:#fff;font-size:12px;font-weight:700;text-anchor:middle}
  /* packets: white rim becomes the surface color in dark mode */
  #packets [stroke],#packets-core [stroke]{stroke:var(--surface)}
  /* phased reveal: new layers fade in as the story adds them */
  .reveal{opacity:0;transition:opacity var(--dur-layout) var(--ease-quart);pointer-events:none}
  .reveal.shown{opacity:1}
  .reveal.shown.stopped{opacity:.35}
  #core{transition:transform var(--dur-entrance) var(--ease-quint),opacity var(--dur-layout) var(--ease-quart);transform-origin:0 0;transform-box:view-box}
  #core.down{opacity:.35}
  /* the snapshot route is only drawn while snapshot mode is playing */
  #p-snap:not(.on), #p-snap:not(.on) + text{opacity:0}
  #p-snap + text{transition:opacity var(--dur-state) var(--ease-quart)}
  /* routes hidden for part of a stage (snapshot: top arrow only appears for the final transaction) */
  .gone{opacity:0!important}
  #t-sync{transition:opacity var(--dur-state) var(--ease-quart)}
  /* HTML overlays */
  #panel{position:absolute;left:1010px;top:110px;width:240px;height:700px;background:var(--surface);border:1.5px solid var(--line-soft);border-radius:14px;padding:14px 14px 10px;box-sizing:border-box;color:var(--ink);display:flex;flex-direction:column}
  #panel .k{font-size:10.5px;letter-spacing:.12em;font-weight:700;color:var(--muted)}
  #panel h3{margin:6px 0 6px;font-size:17px;line-height:1.2}
  #panel p{margin:0 0 6px;font-size:12.5px;line-height:1.42;color:var(--muted);min-height:124px}
  #stepsrc{font-size:10.5px;color:var(--faint);font-style:italic;margin-bottom:8px;min-height:28px}
  /* step change: the narration rises in so the eye catches the new step */
  .enter{animation:rise var(--dur-state) var(--ease-quart) both}
  #stepp.enter{animation-delay:50ms} #stepsrc.enter{animation-delay:100ms}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  #panel > *{flex:none}
  #steps{flex:1 1 auto;min-height:0;list-style:none;margin:0;padding:6px 0 0;border-top:1px solid var(--line-soft);overflow:auto;position:relative}
  #steps li{font-size:11.5px;padding:2px 6px;border-radius:6px;cursor:pointer;color:var(--muted);display:flex;gap:6px;line-height:1.35;transition:background var(--dur-instant) var(--ease-quart),color var(--dur-instant) var(--ease-quart)}
  #steps li:not(.ph):hover{background:var(--surface-2)}
  #steps li b{color:var(--faint);width:18px;flex:none}
  #steps li.ph{cursor:default;font-size:9.5px;letter-spacing:.12em;font-weight:700;color:var(--faint);padding-top:6px;text-transform:uppercase}
  #steps li.cur{background:color-mix(in srgb,var(--lava) 10%,var(--surface));color:var(--ink);font-weight:700}
  #steps li.cur b{color:var(--lava)}
  #controls{position:absolute;left:40px;top:836px;display:flex;gap:8px;align-items:center}
  #controls button,#controls select{font:500 12.5px var(--font);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;transition:border-color var(--dur-instant) var(--ease-quart),background var(--dur-instant) var(--ease-quart),transform var(--dur-instant) var(--ease-quart)}
  #controls button:hover,#controls select:hover{border-color:var(--ink)}
  #controls button:active{transform:translateY(1px)}
  #controls button:focus-visible,#controls select:focus-visible{outline:2px solid var(--lava);outline-offset:2px}
  #controls #play{background:var(--ink);color:var(--stage);border-color:var(--ink);min-width:84px}
  #legend{display:flex;gap:9px;margin-left:6px;font-size:11.5px;color:var(--muted)}
  #legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px;background:var(--c)}
  /* step progress: scaleX, not width, so it never triggers layout */
  #bar{position:absolute;left:0;top:0;height:4px;width:100%;background:var(--lava);transform:scaleX(0);transform-origin:0 0}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>
<div id="stage">
<div id="bar"></div>
<svg id="svg" viewBox="0 0 1280 880" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-idle"/></marker>
    <marker id="ah-q" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="m-q"/></marker>
    <marker id="ah-wal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF3621"/></marker>
    <marker id="ah-page" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2272B4"/></marker>
    <marker id="ah-layer" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFAB00"/></marker>
    <marker id="ah-pq" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00A972"/></marker>
    <marker id="ah-sync" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A4FD6"/></marker>
    <marker id="ah-cdf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B8F8F"/></marker>
    <marker id="ah-dr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4F5FD8"/></marker>
    <marker id="ah-rt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker>
  </defs>

  <!-- Header -->
  <!-- Official Databricks logo icon (databricks.com/sites/default/files/2024-10/Databricks-Logo-Icon.svg, viewBox 15x17) -->
  <g id="db-logo" transform="translate(48,6) scale(2)" aria-label="Databricks">
    <path d="M13.7194 6.60746L7.25506 10.338L0.332928 6.35214L0 6.53654L0 9.43016L7.25506 13.6004L13.7194 9.88406V11.416L7.25506 15.1465L0.332928 11.1607L0 11.3451L0 11.8415L7.25506 16.0117L14.4962 11.8415V8.94789L14.1633 8.76349L7.25506 12.7351L0.776832 9.01881L0.776832 7.4869L7.25506 11.2032L14.4962 7.033V4.18193L14.1356 3.96917L7.25506 7.92661L1.10976 4.40888L7.25506 0.876967L12.3045 3.78477L12.7484 3.52945V3.17484L7.25506 0.0117187L0 4.18193L0 4.63583L7.25506 8.80605L13.7194 5.07555V6.60746Z" fill="#FF3621"/>
  </g>
  <text x="100" y="32" class="title">Lakebase under the hood</text>
  <text x="100" y="50" class="sub" id="sub">Clients connect through control-plane endpoints to one stateless Postgres compute on shared storage</text>

  <!-- ===================== CLIENTS + CONTROL PLANE (fixed above the core in every phase) ===================== -->
  <g id="clients">
    <rect x="40" y="58" width="950" height="58" rx="14" class="topbox"/>
    <text x="420" y="79" class="tophead">Postgres Clients &amp; Drivers</text>
    <text x="714" y="79" class="topsub">SSL Required  OAuth or Password Auth</text>
    <g id="cli-pgadmin" class="node sn clientChip green"><rect x="54" y="92" width="60" height="28" rx="7"/><text x="84" y="110">pgAdmin</text></g>
    <g id="cli-psql" class="node sn clientChip green"><rect x="122" y="92" width="44" height="28" rx="7"/><text x="144" y="110">psql</text></g>
    <g id="cli-dbeaver" class="node sn clientChip green"><rect x="174" y="92" width="62" height="28" rx="7"/><text x="205" y="110">DBeaver</text></g>
    <g id="cli-curl" class="node sn clientChip green"><rect x="244" y="92" width="44" height="28" rx="7"/><text x="266" y="110">curl</text></g>
    <g id="cli-jdbc" class="node sn clientChip"><rect x="296" y="92" width="50" height="28" rx="7"/><text x="321" y="110">JDBC</text></g>
    <g id="cli-psycopg" class="node sn clientChip"><rect x="354" y="92" width="76" height="28" rx="7"/><text x="392" y="110">psycopg3</text></g>
    <g id="cli-sqlalchemy" class="node sn clientChip"><rect x="438" y="92" width="94" height="28" rx="7"/><text x="485" y="110">SQLAlchemy</text></g>
    <g id="cli-node" class="node sn clientChip"><rect x="540" y="92" width="62" height="28" rx="7"/><text x="571" y="110">Node.js</text></g>
    <g id="cli-go" class="node sn clientChip"><rect x="610" y="92" width="36" height="28" rx="7"/><text x="628" y="110">Go</text></g>
    <g id="cli-rust" class="node sn clientChip"><rect x="654" y="92" width="46" height="28" rx="7"/><text x="677" y="110">Rust</text></g>
    <g id="cli-ccpp" class="node sn clientChip"><rect x="708" y="92" width="56" height="28" rx="7"/><text x="736" y="110">C/C++</text></g>
    <g id="cli-dataapi" class="node sn clientChip api"><rect x="772" y="92" width="168" height="28" rx="7"/><text x="856" y="110">Data API (PostgREST)</text></g>
    <text x="515" y="138" class="domain">.database.&lt;region&gt;.cloud.databricks.com</text>
    <path id="p-cli-1" class="flow q" d="M 84 120 C 84 166, 300 194, 515 226"/>
    <path id="p-cli-2" class="flow q" d="M 205 120 C 205 170, 360 198, 515 226"/>
    <path id="p-cli-3" class="flow q" d="M 485 120 C 485 171, 500 198, 515 226"/>
    <path id="p-cli-4" class="flow q" d="M 321 120 C 321 168, 418 196, 515 226"/>
    <rect x="40" y="144" width="950" height="118" rx="14" class="topbox"/>
    <text x="60" y="160" class="toplabel">CONTROL PLANE</text>
    <text x="120" y="184" class="epHead rw">READ-WRITE (R/W)</text>
    <text x="515" y="176" class="epHead mid">ENDPOINT TYPE</text>
    <g id="rw-ep">
      <text x="72" y="211" class="epText">ep-&lt;primary-endpoint-id&gt;</text>
      <text x="72" y="230" class="epText">ep-&lt;primary-endpoint-id&gt;-pooler</text>
      <text x="72" y="247" class="epText api sm">ep-&lt;primary-endpoint-id&gt;/&lt;domain&gt;/api/2.0</text>
      <text x="72" y="259" class="epText api sm">/workspace/&lt;workspace-id&gt;/rest/&lt;pgdatabase&gt;</text>
    </g>
    <text x="515" y="211" class="epMid">Direct Connection</text>
    <path id="p-bc" class="flow q" d="M 515 226 C 515 246, 380 246, 270 270"/>
    <g id="bouncer">
      <rect x="444" y="217" width="142" height="31" rx="8" class="poolTag"/>
      <text x="515" y="231" class="epMid">Connection pooling</text>
      <text x="515" y="243" class="epMid small">(PgBouncer)</text>
    </g>
    <text x="515" y="257" class="epMid api halo">Data API</text>

<script>
(function(){
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);

  // ---------- fit to window ----------
  function fit(){ const s = Math.min(innerWidth/1300, innerHeight/900); $('stage').style.transform = `translate(-50%,-50%) scale(${s})`; }
  addEventListener('resize', fit); fit();

  // ---------- simulation clock (pausable) ----------
  let simT = 0, last = performance.now(), playing = true, speed = 1, auto = true;
  let timers = [], packets = [], stageIdx = 0, stageStart = 0, stageDur = 1, cdfBuf = 0;
  const after = (ms, fn) => timers.push({at: simT + ms, fn});
  const every = (ms, total, fn) => { for (let t = 0; t < total; t += ms) after(t, fn); };
  const ease = t => 1 - Math.pow(1 - t, 4);   // brand ease-out-quart
  const RM = matchMedia('(prefers-reduced-motion: reduce)');

  const COLORS = {wal:'#FF3621', page:'#2272B4', layer:'#FFAB00', pq:'#00A972', ack:'#00A972', sync:'#7A4FD6', sbatch:'#7A4FD6', cdf:'#0B8F8F', batch:'#0B8F8F', dr:'#4F5FD8', rt:'#D9480F', q:'var(--q)'};
  function makeShape(kind){
    const g = document.createElementNS(NS, 'g');
    const c = COLORS[kind];
    if (kind === 'wal' || kind === 'ack' || kind === 'cdf') {
      const e = document.createElementNS(NS, 'circle');
      e.setAttribute('r', kind === 'wal' ? 7 : 6); e.style.fill = c;
      e.setAttribute('stroke', '#fff'); e.setAttribute('stroke-width', 2); g.appendChild(e);
    } else if (kind === 'pq') {
      for (let i = 0; i < 3; i++) { const r = document.createElementNS(NS, 'rect');
        r.setAttribute('x', -8 + i*5.5); r.setAttribute('y', -8); r.setAttribute('width', 4.5); r.setAttribute('height', 16); r.setAttribute('rx', 1);
        r.style.fill = c; g.appendChild(r); }
    } else {
      const big = kind === 'batch' || kind === 'sbatch';
      const r = document.createElementNS(NS, 'rect');
      r.setAttribute('x', big ? -12 : -9); r.setAttribute('y', big ? -9 : -7); r.setAttribute('width', big ? 24 : 18); r.setAttribute('height', big ? 18 : 14); r.setAttribute('rx', 2.5);
      r.style.fill = c; r.setAttribute('stroke', '#fff'); r.setAttribute('stroke-width', 1.5); g.appendChild(r);
    }
    return g;
  }
  // Packets are always placed in the same coordinate system as their path, and always move start -> end (arrow direction)
  function send(pathId, kind, dur, opts = {}){
    const path = $(pathId); const el = makeShape(kind);
    (path.closest('#core') ? $('packets-core') : $('packets')).appendChild(el);
    const p = {path, el, len: path.getTotalLength(), start: simT, dur: RM.matches ? 1 : dur, onArrive: opts.onArrive};
    place(p, 0); packets.push(p);
  }
  function place(p, t){ const pt = p.path.getPointAtLength(p.len * ease(t)); p.el.setAttribute('transform', `translate(${pt.x},${pt.y})`); }

  function flash(id, ms = 500){ const n = $(id); n.classList.add('flash'); after(ms, () => n.classList.remove('flash')); }
  function badge(id, text, cls = '', ms = 0){ const b = $(id); b.querySelector('text').textContent = text; b.setAttribute('class', 'badge show ' + cls); if (ms) after(ms, () => b.classList.remove('show')); }

  function tick(){
    timers.sort((a, b) => a.at - b.at);
    while (timers.length && timers[0].at <= simT) timers.shift().fn();
    for (const p of packets) {
      const t = (simT - p.start) / p.dur;
      if (t >= 1) { p.el.remove(); p.done = true; if (p.onArrive) p.onArrive(); continue; }
      place(p, t);
    }
    packets = packets.filter(p => !p.done);
    $('bar').style.transform = `scaleX(${Math.min(1, (simT - stageStart) / stageDur)})`;
  }
  function frame(now){ const dt = Math.min(now - last, 50); last = now; if (playing) { simT += dt * speed; tick(); } requestAnimationFrame(frame); }

  // ---------- phase / level handling ----------
  // 1 = one compute, 2 = + read replica, 3 = + synced tables, 4 = + CDF, 5 = + managed DR
  const SUB = {
    1: 'Clients connect through control-plane endpoints to one stateless Postgres compute on shared storage',
    2: 'Add a read replica: more compute, same storage, no data copied',
    3: 'Synced tables: Unity Catalog data served from Lakebase',
    4: 'Lakebase CDF: every Postgres change lands in the lakehouse',
    5: 'Lakebase Managed DR: storage-layer replication to another region',
    6: 'Lakehouse//RT: real-time OLAP on Lakebase data, no copy'
  };
  function applyLevel(lv){
    document.querySelectorAll('.reveal').forEach(g => g.classList.toggle('shown', +g.dataset.level <= lv));
    $('core').style.transform = lv >= 3 ? 'translate(13.6px,91.8px) scale(0.66)' : 'none';
    $('sub').textContent = SUB[lv];
  }
  function setFailover(on){
    $('core').classList.toggle('down', on);
    $('lh-sync').classList.toggle('stopped', on); $('lh-cdf').classList.toggle('stopped', on);
    $('sec-pg').classList.toggle('active', on);
    $('sec-pg-sub').textContent = on ? 'promoted to primary (R/W)' : 'secondary \u00b7 idle until failover';
  }

  // ---------- clients: a query from a client chip through control-plane pg_bouncer onto the front end ----------
  const CLI = [['cli-pgadmin','p-cli-1'],['cli-dbeaver','p-cli-2'],['cli-sqlalchemy','p-cli-3'],['cli-jdbc','p-cli-4']];
  function clientQuery(i, then){
    flash(CLI[i][0], 700);
    send(CLI[i][1], 'q', 420, {onArrive: () => { flash('bouncer', 600);
      send('p-bc', 'q', 560, {onArrive: () => { flash('pg1'); if (then) then(); }});
    }});
  }

  // ---------- flow helpers ----------
  function commit(withAck = true){
    badge('b-pg1', 'INSERT \u2026 ; COMMIT', '', 1600);
    let acks = 0;
    [1100, 1350, 2100].forEach((d, i) => after(i * 60, () => send('p-wal-' + (i + 1), 'wal', d, {onArrive: () => {
      flash('sk' + (i + 1)); acks++;
      if (acks === 2 && withAck) {
        badge('b-sk', 'Quorum 2 of 3 \u2713', 'green', 1400);
        send('p-ack', 'ack', 950, {onArrive: () => { flash('pg1'); badge('b-pg1', 'COMMIT acknowledged \u2713', 'green', 1200); }});
      }
    }})));
  }
  const streamWal = () => send('p-sk-ps', 'wal', 700, {onArrive: () => flash(Math.random() < .5 ? 'ps1' : 'ps2')});
  const flushLayer = () => send('p-layers', 'layer', 800, {onArrive: () => flash('os-layers')});
  const flushParquet = () => send('p-parquet', 'pq', 1000, {onArrive: () => flash('os-parquet')});
  const archive = () => send('p-archive', 'wal', 800, {onArrive: () => flash('os-wal')});
  // Read path: show the miss, the pageserver rebuilding the page, then the page flowing up the arrow
  function pageRead(which, q = 'SELECT \u2026 buffer-cache miss'){
    const pg = which === 1 ? 'pg1' : 'pg2', path = which === 1 ? 'p-pr-1' : 'p-pr-2', ps = which === 1 ? 'ps1' : 'ps2', b = which === 1 ? 'b-pg1' : 'b-pg2';
    badge(b, q, 'blue', 1300);
    after(700, () => {
      $(ps).classList.add('blue'); flash(ps, 900); after(900, () => $(ps).classList.remove('blue'));
      badge('b-ps', 'GetPage@LSN \u2192 image + WAL deltas', 'blue', 1300);
      after(650, () => send(path, 'page', 950, {onArrive: () => { flash(pg); badge(b, 'Page returned \u2192 rows sent', 'blue', 1200); }}));
    });
  }
  // Synced tables: UC source -> managed pipeline -> rows written into Postgres (then the normal write path)
  function syncRows(){
    flash('uc-src');
    send('p-sync-src', 'sync', 700, {onArrive: () => {
      flash('pipe'); badge('b-pipe', 'Sync pipeline \u00b7 continuous mode', 'purple', 1500);
      send('p-sync', 'sync', 1500, {onArrive: () => { flash('pg1'); badge('b-pg1', 'Apply synced rows', 'purple', 900); after(500, () => commit()); }});
    }});
  }
  // Lakebase CDF: changes from the WAL are buffered, then appended to a UC Delta history table in batches
  const cdfChange = () => send('p-cdf-1', 'cdf', 650, {onArrive: () => {
    flash('cdf'); cdfBuf++; badge('b-cdf', `Batching ${cdfBuf} change${cdfBuf > 1 ? 's' : ''} (flush ~15 s)`, 'teal');
  }});
  function cdfFlush(){
    if (!cdfBuf) return; const k = cdfBuf; cdfBuf = 0;
    badge('b-cdf', 'Flush batch \u2192 Delta', 'teal', 900);
    send('p-cdf-2', 'batch', 900, {onArrive: () => { flash('hist'); badge('b-hist', `+${k} rows \u00b7 _pg_change_type, _pg_lsn`, 'teal', 1600); }});
  }
  // Managed DR: periodic storage-layer replication to the secondary region
  function drBurst(){
    badge('b-dr', 'Periodic replication \u00b7 RPO in minutes', 'indigo', 1800);
    for (let i = 0; i < 4; i++) after(i * 160, () => send('p-dr', 'dr', 1000, {onArrive: () => flash('sec-data')}));
  }
  const secRead = () => send('p-sec-read', 'page', 650, {onArrive: () => flash('sec-pg')});
  // Lakehouse//RT: read-only OLAP scan of the Parquet copy, then a sub-second result to dashboards
  function rtQuery(){
    badge('b-rt', 'SELECT region, SUM(amount) \u2026 GROUP BY', 'rt', 1600); flash('os-parquet', 700);
    for (let i = 0; i < 3; i++) after(i * 150, () => send('p-rt-1', 'pq', 1300, {onArrive: () => flash('rt')}));
    after(1800, () => send('p-rt-2', 'rt', 600, {onArrive: () => { flash('rt-dash'); badge('b-rt', 'Result in milliseconds', 'rt', 1100); }}));
  }

  // ---------- sources (shown under the narration) ----------
  const S = {
    arch: 'Databricks docs: Lakebase architecture',
    deck: 'Deck slide 16 (Lakebase under the hood)',
    rr: 'Databricks docs: Read replicas',
    sync: 'Databricks docs: Serve lakehouse data with synced tables',
    cdf: 'Databricks docs: Lakebase Change Data Feed (Public Preview); safekeepers hold the WAL per the architecture docs',
    dr: 'Databricks docs: Lakebase Disaster Recovery (Private Preview)',
    rt: 'Databricks docs: LTAP architecture (Lakehouse//RT querying Lakebase, Private Preview) and the Lakehouse//RT (Reyden) FAQ; Parquet as the read source: your description and deck slide 16'
  };

  // ---------- stages ----------
  const P1 = 'Phase 1 \u00b7 One compute', P2 = 'Phase 2 \u00b7 Read replica', P3A = 'Phase 3a \u00b7 Synced tables', P3B = 'Phase 3b \u00b7 Lakebase CDF', P3C = 'Phase 3c \u00b7 Managed DR', P3D = 'Phase 3d \u00b7 Lakehouse//RT', PALL = 'All together';
  const WRITE = ['p-wal-1','p-wal-2','p-wal-3','p-ack'];
  const STAGES = [
    { ph: P1, lv: 1, t: 'Any Postgres client', on: ['p-cli-1','p-cli-2','p-cli-3','p-cli-4','p-bc'], dur: 9000,
      src: 'Databricks docs: Lakebase connection strings (SSL always required) and API guide (SQL clients, drivers, Data API); your description (client list)',
      d: 'Any Postgres-compatible client can connect: pgAdmin, psql, DBeaver, JDBC, psycopg3, SQLAlchemy, the Data API (PostgREST), or drivers for Node.js, Go, Rust, C/C++ and curl. Every connection is SSL-encrypted (sslmode=require) and authenticated with an OAuth token or a native Postgres password.',
      run(){
        ['cli-pgadmin','cli-psql','cli-dbeaver','cli-jdbc','cli-psycopg','cli-sqlalchemy','cli-dataapi'].forEach((c,i) => after(300+i*420, () => flash(c, 900)));
        after(1500, () => badge('b-bc', 'SSL required \u2713 OAuth or Postgres password', 'lava', 2800));
        after(1700, () => clientQuery(0)); after(3900, () => clientQuery(1)); after(6100, () => clientQuery(3));
        after(7500, () => badge('b-pg1', 'Session lands on the front end', 'blue', 1500));
      } },
    { ph: P1, lv: 1, t: 'Control plane: endpoints & pooling', on: ['p-cli-1','p-cli-2','p-cli-3','p-cli-4','p-bc'], dur: 8200,
      src: 'Your lakebase_architecture.md (endpoint DNS patterns); Databricks docs: Lakebase connection pooling (PgBouncer, transaction mode, 10,000 client connections, native Postgres password) and connection strings',
      d: 'Connections arrive at a workspace endpoint in the control plane. The read-write endpoint \u2014 and, once a read replica is running, the read-only endpoint \u2014 each expose a direct DNS name and a pooled one ending in -pooler. Pooled connections are served by pg_bouncer in transaction mode (a server connection is held only for one transaction), supporting up to 10,000 concurrent clients with native Postgres password authentication (not OAuth roles).',
      run(){
        badge('b-bc', 'pg_bouncer \u00b7 many clients \u2192 few back-end sessions', '', 3000);
        after(500, () => clientQuery(2)); after(2100, () => clientQuery(0)); after(3700, () => clientQuery(1));
        after(4900, () => badge('b-bc', 'Burst of clients \u2192 one pooled session', '', 2600));
        after(5300, () => { clientQuery(0); clientQuery(2); clientQuery(3); });
      } },
    { ph: P1, lv: 1, t: 'Write path: commit', on: WRITE, dur: 5200, src: S.arch,
      d: 'A single stateless Postgres compute handles both reads and writes. It streams WAL to three safekeepers, and a transaction commits once a quorum (2 of 3) acknowledges it.',
      run(){ commit(); after(2700, () => commit()); } },
    { ph: P1, lv: 1, t: 'WAL to pageservers', on: ['p-sk-ps'], dur: 5000, src: S.arch,
      d: 'Safekeepers stream WAL to the pageservers, which apply it asynchronously, off the commit path. Pageservers act as a write-through cache above object storage.',
      run(){ badge('b-ps', 'Ingest WAL \u2192 in-memory layer', 'lava'); every(380, 4200, streamWal); } },
    { ph: P1, lv: 1, t: 'Flush to object storage', on: ['p-layers','p-parquet'], dur: 5600, src: S.arch + '; Parquet copy: ' + S.deck,
      d: 'Pageservers persist layer files (page images plus WAL deltas) to object storage. The same flush also writes a columnar Parquet copy.',
      run(){ badge('b-ps', 'Flush layers', 'yellow'); every(650, 4800, flushLayer); after(250, () => every(650, 4600, flushParquet));
             after(900, () => badge('b-os', 'Parquet copy: row versions preserved', 'green')); } },
    { ph: P1, lv: 1, t: 'WAL archive', on: ['p-archive'], dur: 4000, src: S.deck,
      d: 'Safekeepers archive WAL to durable, zone-redundant object storage: the history behind point-in-time restore and branching.',
      run(){ badge('b-sk', 'Archive WAL segments', 'lava'); every(420, 3400, archive); } },
    { ph: P1, lv: 1, t: 'Read path: same compute', on: ['p-cli-1','p-cli-2','p-bc','p-pr-1'], dur: 9500, src: S.arch,
      d: 'A client query misses the compute\u2019s buffer cache, so the same compute requests a page at an LSN. The pageserver reconstructs it and returns it. Only pageservers read from object storage.',
      run(){ clientQuery(0, () => pageRead(1)); after(4400, () => clientQuery(1, () => pageRead(1))); } },
    { ph: P1, lv: 1, t: 'One compute, all flows', on: ['p-cli-1','p-cli-2','p-cli-3','p-cli-4','p-bc',...WRITE,'p-sk-ps','p-layers','p-parquet','p-archive','p-pr-1'], dur: 9000, src: S.arch + '; ' + S.deck,
      d: 'All phase 1 flows together: clients query through pg_bouncer, one compute writes WAL and reads pages, while storage persists, archives and serves the data.',
      run(){ after(800, () => clientQuery(0)); after(5000, () => clientQuery(2));
             every(2000, 8000, () => commit()); every(450, 8600, streamWal); every(1100, 8600, flushLayer);
             after(400, () => every(1100, 8200, flushParquet)); every(900, 8600, archive);
             after(1200, () => pageRead(1)); after(5200, () => pageRead(1)); } },

    { ph: P2, lv: 2, t: 'Add a read replica', on: ['p-pr-2'], dur: 6800, src: S.rr,
      d: 'A read replica is another compute attached to the same storage. Nothing is copied, so it is ready in seconds with no extra storage cost, and it scales (and scales to zero) on its own. Its read-only endpoint appears in the control plane: -ro and -ro-pooler DNS names.',
      run(){ flash('pg2', 900); flash('ro-ep', 2200); badge('b-bc', 'Read-only endpoint live \u00b7 -ro / -ro-pooler DNS', 'blue', 2800); badge('b-pg2', 'New compute \u00b7 ready in seconds', '', 1800); after(2600, () => pageRead(2)); } },
    { ph: P2, lv: 2, t: 'Read scaling', on: [...WRITE,'p-sk-ps','p-pr-1','p-pr-2'], dur: 9000, src: S.rr,
      d: 'Writes still go only to the primary. Reads spread across the primary and the replica, and both fetch pages from the same pageservers.',
      run(){ every(2200, 8000, () => commit()); every(500, 8600, streamWal);
             after(600, () => pageRead(2)); after(2000, () => pageRead(1)); after(3600, () => pageRead(2)); after(5200, () => pageRead(1)); after(6600, () => pageRead(2)); } },

    { ph: P3A, lv: 3, sub: 'a', t: 'Synced tables: Snapshot', on: ['p-sync-src','p-snap',...WRITE,'p-pr-2'], dur: 30000,
      src: 'Your description (bulk write to layer files, then one transaction via the primary); sync modes: ' + S.sync,
      d: 'Snapshot mode copies the full Unity Catalog table. The pipeline writes the rows directly into layer files in storage, bypassing Postgres, then fires one transaction through the primary.',
      run(){
        $('p-sync').classList.add('gone'); $('t-sync').classList.add('gone');
        after(1400, () => badge('b-pipe', 'Snapshot \u00b7 full copy of the source', 'purple'));
        after(1600, () => every(500, 12500, () => { flash('uc-src');
          send('p-sync-src', 'sync', 600, {onArrive: () => { flash('pipe');
            send('p-snap', 'sync', 2400, {onArrive: () => { flash('os-layers'); badge('b-os', 'Snapshot rows \u2192 layer files', 'purple', 900); }}); }}); }));
        after(17500, () => { badge('b-pipe', 'Snapshot written \u2192 one transaction', 'purple');
          $('p-snap').classList.remove('on'); ['p-sync','t-sync'].forEach(id => $(id).classList.remove('gone')); $('p-sync').classList.add('on');
          send('p-sync', 'sync', 1500, {onArrive: () => { flash('pg1'); badge('b-pg1', 'Snapshot transaction', 'purple', 900); after(500, () => commit()); }}); });
        after(23500, () => pageRead(2, 'SELECT \u2026 user_profiles_synced'));
      } },
    { ph: P3A, lv: 3, sub: 'b', t: 'Synced tables: Triggered', on: ['p-sync-src','p-sync',...WRITE,'p-pr-2'], dur: 30000, src: S.sync,
      d: 'Triggered mode runs on a schedule or on demand. Each run applies the changes since the last run as one incremental batch, written through the primary, then waits for the next trigger.',
      run(){
        after(1400, () => badge('b-pipe', 'Triggered \u00b7 incremental batch', 'purple'));
        after(2400, () => { flash('uc-src');
          send('p-sync-src', 'sbatch', 900, {onArrive: () => { flash('pipe', 900);
            send('p-sync', 'sbatch', 2000, {onArrive: () => { flash('pg1'); badge('b-pg1', 'Apply batch', 'purple', 1200); after(500, () => commit()); }}); }}); });
        after(10000, () => pageRead(2, 'SELECT \u2026 user_profiles_synced'));
        after(14000, () => badge('b-pipe', 'Idle until the next trigger', ''));
      } },
    { ph: P3A, lv: 3, sub: 'c', t: 'Synced tables: Continuous', on: ['p-sync-src','p-sync',...WRITE,'p-pr-2'], dur: 30000, src: S.sync,
      d: 'Continuous mode streams changes from the Delta source to the primary in a slow, steady flow, keeping the Postgres table within seconds of the source.',
      run(){
        after(1400, () => { badge('b-pipe', 'Continuous \u00b7 streaming changes', 'purple'); every(1500, 27500, syncRows); });
        after(10000, () => pageRead(2, 'SELECT \u2026 user_profiles_synced')); after(21000, () => pageRead(2, 'SELECT \u2026 user_profiles_synced'));
      } },

    { ph: P3B, lv: 4, t: 'Lakebase CDF', on: [...WRITE,'p-cdf-1','p-cdf-2'], dur: 10500, src: S.cdf,
      d: 'Lakebase CDF captures every insert, update and delete from the WAL and appends it to a Unity Catalog managed Delta table, lb_<table>_history, batched about every 15 seconds (time compressed here).',
      run(){ after(1200, () => { every(1800, 8400, () => commit()); after(1500, () => every(700, 7400, cdfChange)); after(3600, () => every(2600, 5800, cdfFlush)); }); } },

    { ph: P3C, lv: 5, t: 'Managed DR: replication', on: [...WRITE,'p-dr'], dur: 9500, src: S.dr,
      d: 'Managed DR pairs the project with a secondary workspace in another region. Committed data is replicated periodically at the storage layer, so the secondary compute stays idle and there is no standby compute cost.',
      run(){ after(1200, () => { badge('b-sec', 'Idle until failover \u00b7 no standby compute', ''); every(2000, 7600, () => commit()); after(800, () => every(2400, 7000, drBurst)); }); } },
    { ph: P3C, lv: 5, fo: true, t: 'Managed DR: failover', on: ['p-sec-read'], dur: 8500, src: S.dr,
      d: 'Failover is manual (a Project Admin triggers it). The secondary is promoted to primary with a new connection string and token. Synced-table and CDF pipelines terminate and must be reconfigured; synced data is already replicated, CDF Delta tables are not.',
      run(){ badge('b-sec', 'Promoted to primary \u00b7 new connection string', 'green');
             after(700, () => badge('b-pipe', 'Terminated \u00b7 reconfigure after failover', ''));
             after(1200, () => badge('b-cdf', 'Terminated \u00b7 CDF Delta not replicated', ''));
             after(1600, () => every(1100, 6400, secRead)); } },

    { ph: P3D, lv: 6, t: 'Lakehouse//RT: OLAP on Parquet', on: [...WRITE,'p-sk-ps','p-parquet','p-rt-1','p-rt-2'], dur: 14000, src: S.rt,
      d: 'Lakehouse//RT, powered by the Reyden engine, runs read-only OLAP queries (sums, aggregates) on the Parquet copy of Lakebase data, with millisecond-to-sub-second latency at high concurrency. Nothing is copied out, and the primary Postgres compute is not involved, so OLTP is unaffected.',
      run(){ every(2600, 12000, () => commit()); every(600, 12500, streamWal); after(800, () => every(1300, 12500, flushParquet));
             after(1500, () => every(3200, 12000, rtQuery)); } },

    { ph: PALL, lv: 6, t: 'Everything together', on: 'ALL', dur: 12000, src: 'All sources above',
      d: 'Clients query through the control plane, one shared storage layer serves the primary and the replica, the lakehouse in both directions (synced tables in, CDF out), Lakehouse//RT analytics on the Parquet copy, and a secondary region for disaster recovery.',
      run(){ after(600, () => clientQuery(1)); after(4600, () => clientQuery(3)); every(2000, 11000, () => commit()); every(500, 11500, streamWal); every(1200, 11500, flushLayer);
             after(400, () => every(1200, 11000, flushParquet)); every(1000, 11500, archive);
             after(1500, () => pageRead(1)); after(3500, () => pageRead(2)); after(8000, () => pageRead(2));
             after(2500, syncRows); after(7000, syncRows);
             after(1000, () => every(900, 10000, cdfChange)); after(3000, () => every(3000, 8500, cdfFlush));
             after(1800, () => every(3200, 9500, drBurst)); after(2200, () => every(3600, 9500, rtQuery)); } }
  ];

  // ---------- step list (grouped by phase) ----------
  const list = $('steps'), items = [];
  let lastPh = '';
  // step labels: sub-steps share a number (9a, 9b, 9c)
  let num = 0;
  STAGES.forEach(s => { if (!s.sub || s.sub === 'a') num++; s.label = num + (s.sub || ''); });
  const TOTAL = num;
  STAGES.forEach((s, i) => {
    if (s.ph !== lastPh) { const h = document.createElement('li'); h.className = 'ph'; h.textContent = s.ph; list.appendChild(h); lastPh = s.ph; }
    const li = document.createElement('li'); li.innerHTML = `<b>${s.label}</b><span>${s.t}</span>`; li.onclick = () => go(i); list.appendChild(li); items.push(li);
  });

  const ALL_FLOWS = [...document.querySelectorAll('.flow')].map(p => p.id).filter(id => id !== 'p-sec-read' && id !== 'p-snap');

  function go(i){
    stageIdx = (i + STAGES.length) % STAGES.length; const s = STAGES[stageIdx];
    timers = []; packets.forEach(p => p.el.remove()); packets = []; cdfBuf = 0;
    document.querySelectorAll('.flash').forEach(n => n.classList.remove('flash'));
    document.querySelectorAll('.node.sn').forEach(n => n.classList.remove('blue'));
    document.querySelectorAll('.badge').forEach(b => b.classList.remove('show'));
    document.querySelectorAll('.gone').forEach(n => n.classList.remove('gone'));
    applyLevel(s.lv); setFailover(!!s.fo);
    const on = s.on === 'ALL' ? ALL_FLOWS : s.on;
    document.querySelectorAll('.flow').forEach(p => p.classList.toggle('on', on.includes(p.id)));
    $('stepk').textContent = `${s.ph.toUpperCase()} \u00b7 STEP ${s.label} OF ${TOTAL}`;
    $('steph').textContent = s.t; $('stepp').textContent = s.d; $('stepsrc').textContent = 'Source: ' + s.src;
    ['steph','stepp','stepsrc'].forEach(id => { const n = $(id); n.classList.remove('enter'); void n.offsetWidth; n.classList.add('enter'); });
    items.forEach((li, k) => li.classList.toggle('cur', k === stageIdx));
    // keep the current step visible without scrolling the parent page
    const li = items[stageIdx];
    // #steps is position:relative, so li.offsetTop is measured from the top of the list
    if (li.offsetTop < list.scrollTop || li.offsetTop + li.offsetHeight > list.scrollTop + list.clientHeight)
      list.scrollTop = Math.max(0, li.offsetTop - 40);
    stageStart = simT; stageDur = s.dur; s.run();
    after(s.dur, () => { if (auto) go(stageIdx + 1); else timers = []; });
  }

  // ---------- controls ----------
  const setPlay = v => { playing = v; $('play').textContent = v ? '\u275a\u275a Pause' : '\u25b6 Play'; };
  $('play').onclick = () => setPlay(!playing);
  $('next').onclick = () => go(stageIdx + 1);
  $('prev').onclick = () => go(stageIdx - 1);
  $('speed').onchange = e => speed = parseFloat(e.target.value);
  $('auto').onclick = () => { auto = !auto; $('auto').textContent = 'Auto: ' + (auto ? 'on' : 'off'); if (auto && !timers.length) go(stageIdx + 1); };
  const root = document.documentElement;
  const showTheme = () => $('theme').textContent = root.dataset.theme === 'dark' ? 'Light' : 'Dark';
  const toggleTheme = () => { root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('lb-theme', root.dataset.theme); } catch (e) {} showTheme(); };
  $('theme').onclick = toggleTheme; showTheme();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    let saved; try { saved = localStorage.getItem('lb-theme'); } catch (_) {}
    if (!saved) { root.dataset.theme = e.matches ? 'dark' : 'light'; showTheme(); } });
  addEventListener('keydown', e => {
    if (e.key === 't' || e.key === 'T') toggleTheme();
    else if (e.code === 'Space') { e.preventDefault(); setPlay(!playing); }
    else if (e.key === 'ArrowRight') go(stageIdx + 1);
    else if (e.key === 'ArrowLeft') go(stageIdx - 1);
  });

  go(0); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
